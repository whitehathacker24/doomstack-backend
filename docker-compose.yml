version: '3.8'

# Local development stack. Override the defaults below by exporting variables
# or putting them in a .env file next to this one (never commit that file).
services:
  postgres:
    image: postgres:15-alpine
    container_name: doomstack_postgres
    restart: always
    environment:
      POSTGRES_USER: doomstack_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secret_evil_password}
      POSTGRES_DB: doomstack
    ports:
      - "127.0.0.1:5432:5432" # only reachable from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomstack_admin -d doomstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doomstack_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://doomstack_admin:${POSTGRES_PASSWORD:-super_secret_evil_password}@postgres:5432/doomstack?schema=public"
      # Required: no default, so a missing value fails loudly instead of using a publicly known secret.
      # Generate one with `openssl rand -hex 32` and put it in .env or export it.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or your shell (openssl rand -hex 32)}
      # Comma-separated frontend origins allowed to call the API (e.g. http://localhost:5500).
      # Empty = any origin is allowed, which is fine locally.
      CLIENT_URL: ${CLIENT_URL:-}
      # Username that gets the ADMIN role on startup (register it first, then restart the API)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
    # Startup command (schema sync + server) comes from the Dockerfile CMD
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: